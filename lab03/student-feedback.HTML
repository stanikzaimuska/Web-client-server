<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Students Feedback Page</title>

    <!-- Bootstrap Link -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    
    <!-- our css link -->
    <link rel="stylesheet" href="feedback-styles.css">
    <!-- Google fonts link -->
    <!-- if you want to combine many fonts, this link should be updated -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400;1,700&family=Nosifer&display=swap" rel="stylesheet">

<body class="m-3">

    <div class="header bg-dark-subtle mb-3 p-3 rounded-3 text-center">

        <h1>Please Provide Feedback. You may do so anonymously!</h1>
    
    </div>

 <!-- we are adding these div elements to easily identify the partations for adding responsivness -->
<div class="row">

 <!-- md-6 for medium size screen stacking the cols, sm for small screen sizes, and lg for large.  -->
 <!-- the number 6 is here half od the page, for bootstarp the width of the full bage is 12  -->

    <div class="col-md-6">
        <h2>Instructions</h2>
        <p>As one of our students, your thoughts, comments, and  feedback is very important to us.</p>
        <p>Please send them using this form.</p>
        <p>If you would like us to follow up with you please provide your contact information.</p>

    </div>

    <div class="col-md-6">
        <form>

        <label class="form-label" for="student-name">Name</label>
        <input class="form-control" type="text" name="First-name" id="student-name"/>

        <br />

        <label class="form-label" for="student-email">Email</label>
        <input class="form-control" type="text" name="Email" id="student-email" />

        <br />

        <label class="form-label" for="student-feedback">Comments</label>

        <br />

        <textarea class="form-control" required name="Feedback" id="student-feedback"></textarea>

        <br />

        <label class="mb-3" for="confirming">Are you a Current Student?</label>

        <br />
        <!-- Radio Button -->

        <div class="form-check">
            
            <input class="form-check-input" type="radio" name="Current" id="current-yes" />
            <label class="form-check-label" for="current-yes">Yes</label>

        </div>

        <div class="form-check">

            <input class="form-check-input" type="radio" name="Current" id="current-no" />
            <label class="form-check-label" for="current-no" >No</label>

        </div>
        
        <br />

        <!-- Submit Button -->
        <input class="btn btn-dark" type="submit" />

        </form>
    </div>
</div>
  </body>
</html>
